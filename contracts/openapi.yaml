  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource (symbol, run_id, watchlist id) does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request failed schema validation (FastAPI default 422 shape, Section 7).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
    ServiceUnavailable:
      description: 'Required data or an AI provider is unavailable, or the latest snapshot failed validation
        (Section 3.4: ''No trading recommendation is generated when required data is missing or fails
        validation.'').'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    SymbolPath:
      name: symbol
      in: path
      required: true
      schema:
        type: string
      example: FPT
    RunIdPath:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    WatchlistIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    TimeframeQuery:
      name: timeframe
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Timeframe'
      description: 'Section 12.1/12.2: daily, weekly, or monthly. Defaults to 1D.'
    StartDateQuery:
      name: start_date
      in: query
      required: false
      schema:
        type: string
        format: date
    EndDateQuery:
      name: end_date
      in: query
      required: false
      schema:
        type: string
        format: date
    SymbolSearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: 'Section 11: ''Search and filter the security universe.'''
    ExchangeFilterQuery:
      name: exchange
      in: query
      required: false
      schema:
        type: string
    SecurityTypeFilterQuery:
      name: security_type
      in: query
      required: false
      schema:
        type: string
    TradingStatusFilterQuery:
      name: trading_status
      in: query
      required: false
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: 'OPEN ITEM: pagination is not specified by Section 11; added given the full-market
        universe is 1,500-1,800 securities (Section 3.3). See contracts/OPEN_ITEMS.md.'
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    IndicatorIdsQuery:
      name: indicator_ids
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: Restrict to specific indicator ids from Section 14. Omit for all.
    AsOfDateQuery:
      name: as_of_date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Defaults to the latest promoted snapshot date when omitted.
