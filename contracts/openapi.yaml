components:
  schemas:
    AIAnalyzeRequest:
      additionalProperties: false
      properties:
        symbol:
          title: Symbol
          type: string
        question:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Question
        model_config:
          $ref: '#/components/schemas/AIModelConfig'
          description: 'Section 18.2 provider interface: ''analyze(fact_bundle, prompt_template, model_config)
            -> structured_response.'' Python attribute named ai_model_config to avoid Pydantic''s reserved
            `model_` attribute-name namespace; the wire (JSON) field name is `model_config`, matching
            the plan''s own name for this argument. See contracts/OPEN_ITEMS.md.'
      required:
      - symbol
      - model_config
      title: AIAnalyzeRequest
      type: object
    AIAnalyzeResponse:
      additionalProperties: false
      properties:
        analysis:
          $ref: '#/components/schemas/StructuredAIResponse'
        fact_bundle:
          $ref: '#/components/schemas/AIFactBundle'
          description: 'Included so the frontend AI panel (Section 12.5, WP11 acceptance criteria: ''User
            can inspect facts behind the response'') can show the underlying facts without a second round
            trip. Not explicitly named as a response field by Section 11; see contracts/OPEN_ITEMS.md.'
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - analysis
      - fact_bundle
      - provenance
      title: AIAnalyzeResponse
      type: object
    AIFactBundle:
      additionalProperties: false
      properties:
        symbol:
          description: 'Section 10.6: ''Symbol identity and as-of date.'''
          title: Symbol
          type: string
        as_of_date:
          format: date
          title: As Of Date
          type: string
        price_summary:
          additionalProperties: true
          description: 'Section 10.6: ''Price and volume summary.'' OPEN ITEM: no internal shape given
            by the plan. Typed as an open object. See contracts/OPEN_ITEMS.md.'
          title: Price Summary
          type: object
        indicators:
          additionalProperties: true
          description: 'Section 10.6: ''Deterministic indicators.'' OPEN ITEM: Section 14 names the indicator
            list but not the fact-bundle serialization shape. Typed as an open object. See contracts/OPEN_ITEMS.md.'
          title: Indicators
          type: object
        money_flow:
          $ref: '#/components/schemas/MoneyFlowBlock'
          description: 'Section 10.6: ''Money-flow and accumulation metrics from Section 14.'''
        strategy_results:
          description: 'Section 10.6: ''Strategy results and failed criteria.'''
          items:
            $ref: '#/components/schemas/StrategyEvaluationResult'
          title: Strategy Results
          type: array
        financial_summary:
          additionalProperties: true
          description: 'Section 10.6: ''Financial history and growth metrics.'' OPEN ITEM: no internal
            shape given by the plan. Typed as an open object. See contracts/OPEN_ITEMS.md.'
          title: Financial Summary
          type: object
        levels:
          $ref: '#/components/schemas/Levels'
          description: 'Section 10.6: ''Support, resistance, and invalidation candidates.'''
        data_quality:
          additionalProperties: true
          description: 'Section 10.6: ''Data freshness and quality warnings.'' Expected to carry a freshness_status
            and a list of QualityIssue entries (see common.QualityIssue), but the plan does not fix an
            exact shape for this bullet either. Typed as an open object. See contracts/OPEN_ITEMS.md.'
          title: Data Quality
          type: object
        sources:
          description: 'Section 10.6: ''Source URLs...'' — modeled as a list of URL strings.'
          items:
            type: string
          title: Sources
          type: array
        calculation_definitions:
          description: 'Section 10.6: ''...and calculation definitions.'' — modeled as a list of human-readable
            definition strings, matching the per-indicator documentation required by Section 14 (formula,
            input price, adjustment convention, warm-up period, missing-value behavior, comparison reference,
            numerical tolerance).'
          items:
            type: string
          title: Calculation Definitions
          type: array
      required:
      - symbol
      - as_of_date
      - price_summary
      - indicators
      - money_flow
      - financial_summary
      - levels
      - data_quality
      title: AIFactBundle
      type: object
    AIModelConfig:
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/AIProviderType'
        model:
          examples:
          - deepseek/deepseek-v4-flash
          title: Model
          type: string
      required:
      - provider
      - model
      title: AIModelConfig
      type: object
    AIProviderType:
      description: Section 18.2 adapters list.
      enum:
      - openrouter
      - ollama
      - openai_compatible
      title: AIProviderType
      type: string
    BacktestMetrics:
      additionalProperties: false
      description: Section 16 'Required outputs' list, excluding trade/equity/drawdown series.
      properties:
        cagr:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Cagr
        annualized_return:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Annualized Return
        volatility:
          title: Volatility
          type: number
        sharpe:
          description: Section 16 requires this 'with definitions.'
          title: Sharpe
          type: number
        sortino:
          description: Section 16 requires this 'with definitions.'
          title: Sortino
          type: number
        max_drawdown:
          title: Max Drawdown
          type: number
        win_rate:
          title: Win Rate
          type: number
        profit_factor:
          title: Profit Factor
          type: number
        average_holding_period_days:
          title: Average Holding Period Days
          type: number
        turnover:
          title: Turnover
          type: number
        exposure:
          title: Exposure
          type: number
        benchmark_comparison:
          additionalProperties: true
          description: 'OPEN ITEM: Section 16 requires ''Benchmark comparison'' without a defined shape.
            Typed as an open object. See contracts/OPEN_ITEMS.md.'
          title: Benchmark Comparison
          type: object
      required:
      - volatility
      - sharpe
      - sortino
      - max_drawdown
      - win_rate
      - profit_factor
      - average_holding_period_days
      - turnover
      - exposure
      - benchmark_comparison
      title: BacktestMetrics
      type: object
    BacktestPeriod:
      additionalProperties: false
      properties:
        start_date:
          format: date
          title: Start Date
          type: string
        end_date:
          format: date
          title: End Date
          type: string
      required:
      - start_date
      - end_date
      title: BacktestPeriod
      type: object
    BacktestRequest:
      additionalProperties: false
      description: Section 16 'Required controls' list.
      properties:
        strategy_id:
          title: Strategy Id
          type: string
        symbol_universe:
          description: 'OPEN ITEM: the plan does not say whether a backtest targets an explicit symbol
            list, a named universe, or the full market. Modeled as an explicit list of symbols; a full-market
            run is expressed by passing every eligible symbol from /api/symbols. See contracts/OPEN_ITEMS.md.'
          items:
            type: string
          title: Symbol Universe
          type: array
        entry_convention:
          $ref: '#/components/schemas/ExecutionConvention'
        exit_convention:
          description: 'OPEN ITEM: Section 16 requires an ''Exit convention'' but, unlike entry convention,
            does not give a closed list. See contracts/OPEN_ITEMS.md.'
          title: Exit Convention
          type: string
        transaction_cost:
          minimum: 0
          title: Transaction Cost
          type: number
        slippage:
          minimum: 0
          title: Slippage
          type: number
        position_size:
          additionalProperties: true
          description: 'OPEN ITEM: Section 16 requires ''Position size'' without specifying whether it
            is a fixed amount, a percentage of equity, or a volatility-scaled rule. Typed as an open object.
            See contracts/OPEN_ITEMS.md.'
          title: Position Size
          type: object
        max_concurrent_positions:
          minimum: 1
          title: Max Concurrent Positions
          type: integer
        liquidity_constraint:
          additionalProperties: true
          description: 'OPEN ITEM: Section 16 requires a ''Liquidity constraint'' without a defined shape.
            Typed as an open object. See contracts/OPEN_ITEMS.md.'
          title: Liquidity Constraint
          type: object
        price_adjustment_convention:
          description: 'OPEN ITEM: Section 16 requires a ''Price-adjustment convention'' without an enumerated
            set of conventions. See contracts/OPEN_ITEMS.md.'
          title: Price Adjustment Convention
          type: string
        benchmark:
          description: 'Section 16: ''Benchmark.'' Typically a security_master symbol/index_code.'
          title: Benchmark
          type: string
        in_sample_period:
          $ref: '#/components/schemas/BacktestPeriod'
        out_of_sample_period:
          anyOf:
          - $ref: '#/components/schemas/BacktestPeriod'
          - type: 'null'
          default: null
          description: 'Section 16: ''In-sample and out-of-sample periods.'''
      required:
      - strategy_id
      - symbol_universe
      - entry_convention
      - exit_convention
      - transaction_cost
      - slippage
      - position_size
      - max_concurrent_positions
      - liquidity_constraint
      - price_adjustment_convention
      - benchmark
      - in_sample_period
      title: BacktestRequest
      type: object
    BacktestResultsResponse:
      additionalProperties: false
      properties:
        run_id:
          title: Run Id
          type: string
        status:
          examples:
          - completed
          - failed
          title: Status
          type: string
        trades:
          items:
            $ref: '#/components/schemas/Trade'
          title: Trades
          type: array
        equity_curve:
          items:
            $ref: '#/components/schemas/EquityCurvePoint'
          title: Equity Curve
          type: array
        drawdown_curve:
          items:
            $ref: '#/components/schemas/DrawdownCurvePoint'
          title: Drawdown Curve
          type: array
        metrics:
          $ref: '#/components/schemas/BacktestMetrics'
        warnings:
          items:
            type: string
          title: Warnings
          type: array
        data_version:
          title: Data Version
          type: string
        strategy_version:
          title: Strategy Version
          type: string
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - run_id
      - status
      - trades
      - equity_curve
      - drawdown_curve
      - metrics
      - data_version
      - strategy_version
      - provenance
      title: BacktestResultsResponse
      type: object
    BacktestStartResponse:
      additionalProperties: false
      properties:
        run_id:
          title: Run Id
          type: string
        status:
          description: 'OPEN ITEM: see contracts/OPEN_ITEMS.md, ''Job/health status vocabulary.'''
          examples:
          - queued
          - running
          title: Status
          type: string
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - run_id
      - status
      - provenance
      title: BacktestStartResponse
      type: object
    BarsResponse:
      additionalProperties: false
      properties:
        symbol:
          title: Symbol
          type: string
        timeframe:
          $ref: '#/components/schemas/Timeframe'
        bars:
          items:
            $ref: '#/components/schemas/PriceBar'
          title: Bars
          type: array
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - symbol
      - timeframe
      - bars
      - provenance
      title: BarsResponse
      type: object
    DataRefreshRequest:
      additionalProperties: false
      properties:
        force:
          default: false
          description: 'OPEN ITEM: not named by the plan. Added so a caller can request a refresh even
            if one recently succeeded. See contracts/OPEN_ITEMS.md.'
          title: Force
          type: boolean
      title: DataRefreshRequest
      type: object
    DataRefreshResponse:
      additionalProperties: false
      properties:
        run_id:
          title: Run Id
          type: string
        status:
          description: 'OPEN ITEM: see contracts/OPEN_ITEMS.md, ''Job/health status vocabulary.'''
          examples:
