          title: Status
          type: string
        started_at:
          format: date-time
          title: Started At
          type: string
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - run_id
      - status
      - started_at
      - provenance
      title: DataRefreshResponse
      type: object
    DataStatusResponse:
